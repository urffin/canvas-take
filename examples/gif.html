<!doctype html>
<meta charset="utf-8">
<title>CanvasTake offline GIF</title>
<h1>CanvasTake offline GIF</h1>
<p>800 × 450, 120 frames at 50 ms, then a 2-second final hold. The timeline is rendered offline.</p>
<button id="export">Export GIF</button>
<button id="cancel" disabled>Cancel</button>
<pre id="status">Ready</pre>
<canvas width="800" height="450" style="max-width:100%"></canvas>
<p><a id="download" hidden download="canvas-take.gif">Download GIF</a></p>
<img id="preview" alt="Exported GIF preview" style="max-width:100%">
<script type="module">
import { createGifExporter } from '../dist/gif.js';
import { createGifencEncoder } from '../dist/gifenc.js';
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const start = document.querySelector('#export');
const cancel = document.querySelector('#cancel');
const status = document.querySelector('#status');
const download = document.querySelector('#download');
let url;
function draw(time) {
    ctx.fillStyle = '#102030'; ctx.fillRect(0, 0, 800, 450);
    ctx.fillStyle = '#ffffff'; ctx.font = '28px sans-serif';
    ctx.fillText('Offline timeline · ' + (time / 1000).toFixed(2) + ' s', 32, 52);
    for (let i = 0; i < 8; i++) {
        const reached = i <= Math.floor(time / 750);
        ctx.fillStyle = reached ? '#44ddaa' : '#415568';
        ctx.beginPath(); ctx.arc(70 + i * 94, 225 + Math.sin(i) * 60, 28, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.fillText(String(i + 1), 62 + i * 94, 235 + Math.sin(i) * 60);
    }
}
draw(0);
start.onclick = async () => {
    const controller = new AbortController();
    const gif = createGifExporter({ encoder: createGifencEncoder({ maxColors: 128, quality: 'high' }),
        repeat: 0, signal: controller.signal });
    start.disabled = true; cancel.disabled = false;
    cancel.onclick = () => controller.abort();
    const started = performance.now();
    try {
        for (let time = 0; time < 6000; time += 50) {
            draw(time);
            await gif.addFrame(canvas, 50);
            status.textContent = `Encoding ${time / 50 + 1}/121`;
        }
        draw(6000); await gif.addFrame(canvas, 2000);
        const blob = await gif.finish();
        if (url) URL.revokeObjectURL(url);
        url = URL.createObjectURL(blob);
        document.querySelector('#preview').src = url;
        download.href = url; download.hidden = false;
        status.textContent = JSON.stringify({ frames: 121, durationMs: 8000, bytes: blob.size,
            encodeMs: Math.round(performance.now() - started), state: gif.state }, null, 2);
    } catch (error) { status.textContent = `${error.name}: ${error.message}`; }
    finally { gif.dispose(); start.disabled = false; cancel.disabled = true; cancel.onclick = null; }
};
addEventListener('pagehide', () => { if (url) URL.revokeObjectURL(url); });
</script>
