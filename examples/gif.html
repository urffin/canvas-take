<!doctype html>
<meta charset="utf-8">
<title>CanvasTake offline GIF</title>
<h1>CanvasTake offline GIF</h1>
<p>800 × 450, 120 frames at 50 ms, then a 2-second final hold. The timeline is rendered offline.</p>
<form id="settings">
<fieldset>
<legend>Export limits</legend>
<p>Limits include the final hold. Leave a field empty for no extra limit.</p>
<p><label>Maximum frame pixels (width × height)
<input id="max-pixels" type="number" min="1" step="1" max="9007199254740991" value="360000"></label></p>
<p><label>Maximum frames
<input id="max-frames" type="number" min="1" step="1" max="9007199254740991" value="121"></label></p>
<p><label>Maximum duration (ms)
<input id="max-duration" type="number" min="1" step="1" max="9007199254740991" value="8000"></label></p>
</fieldset>
<button id="export" type="submit">Export GIF</button>
<button id="cancel" type="button" disabled>Cancel</button>
</form>
<pre id="status" role="status" aria-live="polite">Ready</pre>
<canvas width="800" height="450" style="max-width:100%"></canvas>
<p><a id="download" hidden download="canvas-take.gif">Download GIF</a></p>
<img id="preview" alt="Exported GIF preview" style="max-width:100%">
<script type="module">
import { createGifExporter } from '../dist/gif.js';
import { createGifWorkerEncoder } from '../dist/gif-worker.js';
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const start = document.querySelector('#export');
const cancel = document.querySelector('#cancel');
const status = document.querySelector('#status');
const download = document.querySelector('#download');
const form = document.querySelector('#settings'), fields = form.querySelector('fieldset');
const preview = document.querySelector('#preview');
let url, controller;
function clearResult() {
    download.hidden = true; download.removeAttribute('href'); preview.removeAttribute('src');
    if (url) { URL.revokeObjectURL(url); url = undefined; }
}
function draw(time) {
    ctx.fillStyle = '#102030'; ctx.fillRect(0, 0, 800, 450);
    ctx.fillStyle = '#ffffff'; ctx.font = '28px sans-serif';
    ctx.fillText('Offline timeline · ' + (time / 1000).toFixed(2) + ' s', 32, 52);
    for (let i = 0; i < 8; i++) {
        const reached = i <= Math.floor(time / 750);
        ctx.fillStyle = reached ? '#44ddaa' : '#415568';
        ctx.beginPath(); ctx.arc(70 + i * 94, 225 + Math.sin(i) * 60, 28, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.fillText(String(i + 1), 62 + i * 94, 235 + Math.sin(i) * 60);
    }
}
draw(0);
form.onsubmit = async event => {
    event.preventDefault();
    if (start.disabled || !form.reportValidity()) return;
    const limit = id => { const input = document.querySelector(id); return input.value === '' ? undefined : input.valueAsNumber; };
    const limits = { maxFramePixels: limit('#max-pixels'), maxFrames: limit('#max-frames'), maxDurationMs: limit('#max-duration') };
    controller = new AbortController();
    let gif;
    start.disabled = fields.disabled = true; cancel.disabled = false;
    clearResult(); status.textContent = 'Starting export…';
    cancel.onclick = () => controller.abort();
    const started = performance.now();
    try {
        gif = createGifExporter({ encoder: createGifWorkerEncoder({ maxColors: 128, quality: 'high' }),
            repeat: 0, signal: controller.signal, totalFrames: 121, ...limits,
            onProgress: p => { status.textContent = `${p.phase}: ${p.framesEncoded}/${p.totalFrames}, ${p.durationMs} ms`; } });
        for (let time = 0; time < 6000; time += 50) {
            draw(time);
            await gif.addFrame(canvas, 50);
        }
        draw(6000); await gif.addFrame(canvas, 2000);
        const blob = await gif.finish();
        url = URL.createObjectURL(blob);
        preview.src = url;
        download.href = url; download.hidden = false;
        status.textContent = JSON.stringify({ frames: 121, durationMs: 8000, bytes: blob.size,
            encodeMs: Math.round(performance.now() - started), state: gif.state }, null, 2);
    } catch (error) {
        const messages = {
            maxFramePixels: 'Frame size limit exceeded: this canvas uses 360,000 pixels (800 × 450). Increase Maximum frame pixels and try again.',
            maxFrames: 'Frame count limit exceeded. This animation needs 121 frames. Increase Maximum frames and try again.',
            maxDurationMs: 'Duration limit exceeded. This animation needs 8,000 ms including the final hold. Increase Maximum duration and try again.'
        };
        const key = error instanceof RangeError && Object.keys(messages).find(key => error.message.includes(key));
        status.textContent = key ? messages[key] : error.name === 'AbortError' ? 'Export cancelled. You can start again.' : `${error.name}: ${error.message}`;
    }
    finally { gif?.dispose(); controller = undefined; start.disabled = fields.disabled = false; cancel.disabled = true; cancel.onclick = null; }
};
addEventListener('pagehide', () => { controller?.abort(); clearResult(); });
</script>
