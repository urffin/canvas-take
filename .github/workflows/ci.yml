name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build, typecheck and test
        run: npm test
      - name: Verify packed consumer
        run: npm run test:package

  browser:
    name: Browser video, GIF, APNG and WebP (Chromium / Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Start virtual audio output for Firefox Web Audio
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=canvastake
          pactl set-default-sink canvastake
          pactl info
      - name: Verify packed public APNG controller and Worker
        run: npm run test:apng:package
      - name: Verify installed public WebP, cancellation and decoded retry
        shell: bash
        run: npm run test:webp:package:browser 2>&1 | tee webp-package-ci.log
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
            benchmark-results/webp-public-package/
            webp-package-ci.log
          retention-days: 7

  next-integration:
    name: Next.js packed WebP Worker consumer (Chromium / Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Verify production Next.js WebP, cancellation and decoded retry
        shell: bash
        run: npm run test:next:webp 2>&1 | tee webp-next-ci.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: next-webp-results
          path: |
            benchmark-results/webp-public-next/
            webp-next-ci.log
          retention-days: 7
